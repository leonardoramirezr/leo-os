name: Deploy to GitHub Pages

# Every branch publishes: main becomes the site, anything else a preview under
# previews/<branch>/. Both land in the `gh-pages` branch, which is what Pages serves.
on:
  push:
    branches:
      - '**'
      - '!gh-pages'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One publish per branch: a new push makes the one in flight pointless.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    # A fork cannot write to this repository's gh-pages branch.
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - id: target
        name: Work out where this push goes
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          repo='${{ github.event.repository.name }}'
          site="https://$owner.github.io/$repo"

          if [ "$GITHUB_REF_NAME" = '${{ github.event.repository.default_branch }}' ]; then
            {
              echo "preview=false"
              echo "base=/$repo"
              echo "url=$site/"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          slug=$(scripts/preview-slug.sh "$GITHUB_REF_NAME")
          if [ -z "$slug" ]; then
            echo "✖ No usable preview name for branch $GITHUB_REF_NAME" >&2
            exit 1
          fi
          {
            echo "preview=true"
            echo "slug=$slug"
            echo "base=/$repo/previews/$slug"
            echo "url=$site/previews/$slug/"
          } >> "$GITHUB_OUTPUT"

      # Only from the default branch. The migrations are one line of history, and two branches
      # applying their own would tangle it — so `public` only ever gets the ones main has.
      - name: Bring the database up to date
        if: steps.target.outputs.preview != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate

      # A branch's migrations are tried in its preview's own schema instead: a copy of `public`, rows
      # included, made anew on every push. `public` is only read. Until NEON_API_KEY and
      # NEON_PROJECT_ID are set, it says so and the preview uses the published data.
      - id: database
        name: Give the preview a schema of its own
        if: steps.target.outputs.preview == 'true'
        env:
          SLUG: ${{ steps.target.outputs.slug }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          VITE_NEON_DATA_API_URL: ${{ vars.NEON_DATA_API_URL }}
        run: pnpm db:preview create "$SLUG"

      - run: pnpm build
        env:
          BASE_PATH: ${{ steps.target.outputs.base }}
          # Where Neon is, from the repository variables. Neither is a secret: both are the public
          # addresses of services that decide for themselves what the caller may see, and both end
          # up in the published JavaScript either way.
          VITE_NEON_AUTH_URL: ${{ vars.NEON_AUTH_URL }}
          VITE_NEON_DATA_API_URL: ${{ vars.NEON_DATA_API_URL }}
          # The preview's schema; empty for the site, and for a preview that has none.
          VITE_NEON_DATA_API_SCHEMA: ${{ steps.database.outputs.schema }}

      # Read back by scripts/previews-index.mjs to label the preview with its branch.
      - name: Note the branch behind the preview
        if: steps.target.outputs.preview == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          node -e 'require("node:fs").writeFileSync(
            "dist/preview.json",
            JSON.stringify({
              branch: process.env.BRANCH,
              sha: process.env.SHA,
              updated: new Date().toISOString().replace(/\.\d+Z$/, "Z")
            })
          )'

      - name: Publish to gh-pages
        env:
          PREVIEW: ${{ steps.target.outputs.preview }}
          SLUG: ${{ steps.target.outputs.slug }}
          PAGES_MESSAGE: ${{ github.ref_name }} @ ${{ github.sha }}
        run: |
          if [ "$PREVIEW" = 'true' ]; then
            scripts/publish-pages.sh preview "$SLUG" dist
          else
            scripts/publish-pages.sh site dist
          fi

      - name: Leave the link
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW: ${{ steps.target.outputs.preview }}
          URL: ${{ steps.target.outputs.url }}
          SCHEMA: ${{ steps.database.outputs.schema }}
        run: |
          if [ "$PREVIEW" != 'true' ]; then
            printf '### Published site\n\n%s\n\nCommit `%s`.\n' \
              "$URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -n "$SCHEMA" ]; then
            data="Its data: schema \`$SCHEMA\`, a copy of the published data made at this push, with the"
            data="$data migrations of this branch applied. Nothing done in the preview reaches the site."
          else
            data="Its data: the published site's own. The preview database is not set up (see «Previews»"
            data="$data in README.md)."
          fi

          printf '### Preview\n\n%s\n\nBranch `%s`, commit `%s`.\n\n%s\n' \
            "$URL" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$data" >> "$GITHUB_STEP_SUMMARY"

          # Sticky comment on the pull request of this branch, if it has one open.
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')
          [ -n "$pr" ] || exit 0

          body=$(printf '**Preview of this PR:** %s\n\nUpdated with `%s`. GitHub Pages takes a minute to serve the change. It is republished on every push and removed when the branch is deleted.\n\n%s' \
            "$URL" "${GITHUB_SHA:0:7}" "$data")
          gh pr comment "$pr" --body "$body" --edit-last --create-if-none ||
            gh pr comment "$pr" --body "$body" ||
            echo "▸ Published, but could not comment on the pull request." >&2
