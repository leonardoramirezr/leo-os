name: Drop the preview

# A deleted branch leaves its preview behind: its folder in gh-pages, its database schema, and what
# it uploaded to Leogram's bucket.
on:
  delete:

permissions:
  contents: write

concurrency:
  group: pages-cleanup

jobs:
  remove:
    if: github.event.ref_type == 'branch' && github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - id: target
        name: Work out the preview's name
        env:
          DELETED: ${{ github.event.ref }}
        run: echo "slug=$(scripts/preview-slug.sh "$DELETED")" >> "$GITHUB_OUTPUT"

      # Before dropping the preview: rewriting the list of previews rasterizes its icon.
      - if: steps.target.outputs.slug != ''
        run: pnpm install --frozen-lockfile

      - name: Drop previews/<branch>
        if: steps.target.outputs.slug != ''
        env:
          SLUG: ${{ steps.target.outputs.slug }}
          PAGES_MESSAGE: Drop the preview of ${{ github.event.ref }}
        run: scripts/publish-pages.sh remove "$SLUG"

      - name: Drop its schema
        if: steps.target.outputs.slug != ''
        env:
          SLUG: ${{ steps.target.outputs.slug }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          VITE_NEON_DATA_API_URL: ${{ vars.NEON_DATA_API_URL }}
        run: pnpm db:preview drop "$SLUG"

      # Once the schema is gone, nothing points to the preview's files: they go with the others
      # nothing points to, as soon as they are an hour old — this run, or the next deploy.
      - name: Delete its files
        if: steps.target.outputs.slug != ''
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          VITE_NEON_DATA_API_URL: ${{ vars.NEON_DATA_API_URL }}
          LEOGRAM_BUCKET: ${{ vars.LEOGRAM_BUCKET }}
          LEOGRAM_STORAGE_ACCESS_KEY_ID: ${{ secrets.LEOGRAM_STORAGE_ACCESS_KEY_ID }}
          LEOGRAM_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.LEOGRAM_STORAGE_SECRET_ACCESS_KEY }}
        run: pnpm db:storage
