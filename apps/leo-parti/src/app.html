<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<!-- No viewport-fit=cover: iOS 26 draws home-screen web apps a status bar's height short of the
		     screen. With cover the empty band is left at the bottom; without it, it sits under the status bar. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2ec" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121218" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Leo Partī" />
		<!-- What a shared link shows before it is opened: a post's own photo would take a server. -->
		<meta name="description" content="Una publicación en Leo Partī." />
		<meta property="og:title" content="Leo Partī" />
		<meta property="og:description" content="Una publicación en Leo Partī." />
		<!-- Safari ignores an SVG here, so scripts/icons.mjs rasterizes icon.svg into this PNG. -->
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<title>Leo Partī</title>
		<style>
			html {
				background: #f2f2ec;
			}
			@media (prefers-color-scheme: dark) {
				html {
					background: #121218;
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
