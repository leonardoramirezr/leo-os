<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
	<defs>
		<linearGradient id="markdown-table-bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ff7aa2" />
			<stop offset="1" stop-color="#be185d" />
		</linearGradient>
		<radialGradient id="markdown-table-glow" cx="0.28" cy="0.18" r="0.9">
			<stop offset="0" stop-color="#fff" stop-opacity="0.26" />
			<stop offset="1" stop-color="#fff" stop-opacity="0" />
		</radialGradient>
		<clipPath id="markdown-table-card">
			<rect x="160" y="208" width="704" height="608" rx="72" />
		</clipPath>
	</defs>
	<rect width="1024" height="1024" fill="url(#markdown-table-bg)" />
	<rect width="1024" height="1024" fill="url(#markdown-table-glow)" />
	<!-- The table: a card with its header row tinted, three columns and three rows below it -->
	<g clip-path="url(#markdown-table-card)">
		<rect x="160" y="208" width="704" height="608" fill="#fff" />
		<rect x="160" y="208" width="704" height="164" fill="#ffd9e6" />
		<g fill="#f7c6d8">
			<rect x="160" y="368" width="704" height="8" />
			<rect x="160" y="512" width="704" height="6" />
			<rect x="160" y="658" width="704" height="6" />
			<rect x="391" y="208" width="6" height="608" />
			<rect x="627" y="208" width="6" height="608" />
		</g>
	</g>
	<!-- The header, bold -->
	<g fill="#be185d">
		<rect x="216" y="268" width="128" height="44" rx="22" />
		<rect x="452" y="268" width="128" height="44" rx="22" />
		<rect x="688" y="268" width="120" height="44" rx="22" />
	</g>
	<!-- The rows, the last column lined up on the right -->
	<g fill="#f3a5c2">
		<rect x="216" y="424" width="120" height="40" rx="20" />
		<rect x="452" y="424" width="96" height="40" rx="20" />
		<rect x="712" y="424" width="96" height="40" rx="20" />
		<rect x="216" y="570" width="92" height="40" rx="20" />
		<rect x="452" y="570" width="124" height="40" rx="20" />
		<rect x="736" y="570" width="72" height="40" rx="20" />
		<rect x="216" y="716" width="128" height="40" rx="20" />
		<rect x="452" y="716" width="80" height="40" rx="20" />
		<rect x="696" y="716" width="112" height="40" rx="20" />
	</g>
</svg>
