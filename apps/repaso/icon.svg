<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
	<defs>
		<linearGradient id="repaso-bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#2fa4ff" />
			<stop offset="1" stop-color="#5a3fe4" />
		</linearGradient>
		<radialGradient id="repaso-glow" cx="0.28" cy="0.18" r="0.9">
			<stop offset="0" stop-color="#fff" stop-opacity="0.3" />
			<stop offset="1" stop-color="#fff" stop-opacity="0" />
		</radialGradient>
		<linearGradient id="repaso-bolt" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#2f9dff" />
			<stop offset="1" stop-color="#5a3fe4" />
		</linearGradient>
		<filter id="repaso-shadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#1b1464" flood-opacity="0.35" />
		</filter>
	</defs>
	<rect width="1024" height="1024" fill="url(#repaso-bg)" />
	<rect width="1024" height="1024" fill="url(#repaso-glow)" />
	<!-- The deck: the card still to come, behind -->
	<rect
		x="235"
		y="200"
		width="470"
		height="600"
		rx="64"
		fill="#fff"
		opacity="0.35"
		transform="rotate(-12 470 500)"
	/>
	<!-- The card on top, with the flash that gives flashcards their name -->
	<g transform="rotate(7 560 540)">
		<rect x="325" y="240" width="470" height="600" rx="64" fill="#fff" filter="url(#repaso-shadow)" />
		<path
			d="M610 358 460 576h94l-44 156 156-231h-96z"
			fill="url(#repaso-bolt)"
			stroke="url(#repaso-bolt)"
			stroke-width="24"
			stroke-linejoin="round"
		/>
	</g>
</svg>
