<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
	<defs>
		<linearGradient id="settings-bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ffffff" />
			<stop offset="1" stop-color="#ebebf0" />
		</linearGradient>
		<linearGradient id="settings-on" x1="0" y1="220" x2="0" y2="480" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#4cd964" />
			<stop offset="1" stop-color="#28b84a" />
		</linearGradient>
		<linearGradient id="settings-off" x1="0" y1="544" x2="0" y2="804" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#dcdce1" />
			<stop offset="1" stop-color="#e9e9ee" />
		</linearGradient>
		<filter id="settings-track" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
			<feGaussianBlur in="SourceAlpha" stdDeviation="16" />
			<feOffset dy="12" result="offset" />
			<feFlood flood-color="#1f7a35" flood-opacity="0.22" />
			<feComposite in2="offset" operator="in" />
		</filter>
		<filter id="settings-knob" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
			<feGaussianBlur in="SourceAlpha" stdDeviation="10" />
			<feOffset dy="8" result="offset" />
			<feFlood flood-color="#000" flood-opacity="0.25" />
			<feComposite in2="offset" operator="in" />
		</filter>
	</defs>
	<rect width="1024" height="1024" fill="url(#settings-bg)" />
	<!-- The shadow is a copy of its own under each shape: Safari draws whatever goes through
	     a filter blurry on 3x screens, and a shadow can afford to be. -->
	<!-- On -->
	<rect x="206" y="220" width="612" height="260" rx="130" filter="url(#settings-track)" />
	<rect x="206" y="220" width="612" height="260" rx="130" fill="url(#settings-on)" />
	<circle cx="688" cy="350" r="108" filter="url(#settings-knob)" />
	<circle cx="688" cy="350" r="108" fill="#fff" />
	<!-- Off -->
	<rect x="206" y="544" width="612" height="260" rx="130" fill="url(#settings-off)" />
	<circle cx="336" cy="674" r="108" filter="url(#settings-knob)" />
	<circle cx="336" cy="674" r="108" fill="#fff" />
</svg>
