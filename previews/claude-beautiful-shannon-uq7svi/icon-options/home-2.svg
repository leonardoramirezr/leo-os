<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
	<defs>
		<linearGradient id="home-bg" x1="0" y1="0" x2="0.4" y2="1">
			<stop offset="0" stop-color="#3d2b80" />
			<stop offset="1" stop-color="#1a1244" />
		</linearGradient>
		<radialGradient id="home-warmth" cx="0.12" cy="0.06" r="0.75">
			<stop offset="0" stop-color="#ff965a" stop-opacity="0.22" />
			<stop offset="1" stop-color="#ff965a" stop-opacity="0" />
		</radialGradient>
		<linearGradient id="home-accent" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ffa95a" />
			<stop offset="1" stop-color="#e94fa1" />
		</linearGradient>
		<linearGradient id="home-tile-0" x1="0" y1="226" x2="0" y2="394" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#ffb27a" />
			<stop offset="1" stop-color="#ff965a" />
		</linearGradient>
		<linearGradient id="home-tile-1" x1="0" y1="428" x2="0" y2="596" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#ff6fb8" />
			<stop offset="1" stop-color="#f046a0" />
		</linearGradient>
		<linearGradient id="home-tile-2" x1="0" y1="630" x2="0" y2="798" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#a070ff" />
			<stop offset="1" stop-color="#8246f0" />
		</linearGradient>
		<linearGradient id="home-tile-3" x1="0" y1="630" x2="0" y2="798" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#5a9bff" />
			<stop offset="1" stop-color="#2878ff" />
		</linearGradient>
		<filter id="home-shadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
			<feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#0b0726" flood-opacity="0.5" />
		</filter>
	</defs>
	<rect width="1024" height="1024" fill="url(#home-bg)" />
	<rect width="1024" height="1024" fill="url(#home-warmth)" />
	<!-- L, for Leo, made of apps -->
	<g filter="url(#home-shadow)">
		<rect x="351" y="226" width="168" height="168" rx="46" fill="url(#home-tile-0)" />
		<rect x="351" y="428" width="168" height="168" rx="46" fill="url(#home-tile-1)" />
		<rect x="351" y="630" width="168" height="168" rx="46" fill="url(#home-tile-2)" />
		<rect x="553" y="630" width="168" height="168" rx="46" fill="url(#home-tile-3)" />
	</g>
</svg>
