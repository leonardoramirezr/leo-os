<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
	<defs>
		<linearGradient id="icon-bg" x1="0" y1="0" x2="0.4" y2="1">
			<stop offset="0" stop-color="#3b2a7a" />
			<stop offset="1" stop-color="#1c1446" />
		</linearGradient>
		<linearGradient id="icon-accent" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ffa95a" />
			<stop offset="1" stop-color="#e94fa1" />
		</linearGradient>
	</defs>
	<rect width="1024" height="1024" rx="230" fill="url(#icon-bg)" />
	<!-- 3 × 3 tiles, fading towards the bottom right so the grid reads with some depth. -->
	<g fill="#fff">
		<rect x="224" y="224" width="160" height="160" rx="44" />
		<rect x="432" y="224" width="160" height="160" rx="44" opacity="0.94" />
		<rect x="640" y="224" width="160" height="160" rx="44" opacity="0.88" />
		<rect x="224" y="432" width="160" height="160" rx="44" opacity="0.94" />
		<rect x="432" y="432" width="160" height="160" rx="44" fill="url(#icon-accent)" />
		<rect x="640" y="432" width="160" height="160" rx="44" opacity="0.82" />
		<rect x="224" y="640" width="160" height="160" rx="44" opacity="0.88" />
		<rect x="432" y="640" width="160" height="160" rx="44" opacity="0.82" />
		<rect x="640" y="640" width="160" height="160" rx="44" opacity="0.76" />
	</g>
</svg>
