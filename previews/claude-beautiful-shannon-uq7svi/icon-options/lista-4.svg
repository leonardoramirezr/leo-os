<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
	<defs>
		<linearGradient id="lista-bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ffffff" />
			<stop offset="1" stop-color="#ececf1" />
		</linearGradient>
		<linearGradient id="lista-mic" x1="0" y1="220" x2="0" y2="800" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#ffab2e" />
			<stop offset="1" stop-color="#f4560c" />
		</linearGradient>
		<filter id="lista-shadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
			<feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#f4560c" flood-opacity="0.28" />
		</filter>
	</defs>
	<rect width="1024" height="1024" fill="url(#lista-bg)" />
	<g filter="url(#lista-shadow)">
		<!-- A microphone that ticks what it hears -->
		<rect x="412" y="226" width="200" height="360" rx="100" fill="url(#lista-mic)" />
		<g fill="none" stroke="url(#lista-mic)" stroke-width="54" stroke-linecap="round">
			<path d="M340 470a172 172 0 0 0 344 0" />
			<path d="M512 642v104M420 770h184" />
		</g>
	</g>
	<path
		d="M458 408l38 38 72-84"
		fill="none"
		stroke="#fff"
		stroke-width="40"
		stroke-linecap="round"
		stroke-linejoin="round"
	/>
</svg>
