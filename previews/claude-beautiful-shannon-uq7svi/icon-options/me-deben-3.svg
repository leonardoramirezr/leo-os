		<path d="M282 630v58a230 84 0 0 0 460 0v-58z" fill="url(#me-deben-side)" />
		<path d="M282 572v58a230 84 0 0 0 460 0v-58z" fill="url(#me-deben-side)" />
		<ellipse cx="512" cy="572" rx="230" ry="84" fill="url(#me-deben-face)" />
	</g>
	<g fill="none" stroke-linecap="round">
		<path d="M282 630a230 84 0 0 0 460 0M282 688a230 84 0 0 0 460 0" stroke="#8a5200" stroke-opacity="0.35" stroke-width="6" />
		<ellipse cx="512" cy="572" rx="174" ry="62" stroke="#e0a000" stroke-width="12" />
