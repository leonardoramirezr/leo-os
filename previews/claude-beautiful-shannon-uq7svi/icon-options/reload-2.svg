<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
	<defs>
		<linearGradient id="reload-bg" x1="0" y1="0" x2="0.25" y2="1">
			<stop offset="0" stop-color="#5ab4ff" />
			<stop offset="1" stop-color="#0a5fe8" />
		</linearGradient>
		<radialGradient id="reload-glow" cx="0.3" cy="0.05" r="0.8">
			<stop offset="0" stop-color="#fff" stop-opacity="0.3" />
			<stop offset="1" stop-color="#fff" stop-opacity="0" />
		</radialGradient>
		<filter id="reload-shadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
			<feGaussianBlur in="SourceAlpha" stdDeviation="18" />
			<feOffset dy="14" result="offset" />
			<feFlood flood-color="#063a8f" flood-opacity="0.4" />
			<feComposite in2="offset" operator="in" />
		</filter>
		<!-- Two arrows chasing each other round -->
		<g id="reload-arrows" fill="#fff" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
			<path d="M271.7 443.1A250 250 0 0 1 697.8 344.7M752.3 580.9A250 250 0 0 1 326.2 679.3" fill="none" stroke-width="80" />
			<path d="M760 413.8L585.3 369.3L734 235.4ZM264 610.2L438.7 654.7L290 788.6Z" stroke-width="26" />
		</g>
	</defs>
	<rect width="1024" height="1024" fill="url(#reload-bg)" />
	<rect width="1024" height="1024" fill="url(#reload-glow)" />
	<!-- The shadow is a copy of its own under the arrows: Safari draws whatever goes through
	     a filter blurry on 3x screens, and a shadow can afford to be. -->
	<use href="#reload-arrows" filter="url(#reload-shadow)" />
	<use href="#reload-arrows" />
</svg>
