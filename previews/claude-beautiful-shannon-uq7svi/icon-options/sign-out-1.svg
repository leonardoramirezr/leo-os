<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
	<defs>
		<linearGradient id="sign-out-bg" x1="0" y1="0" x2="0.25" y2="1">
			<stop offset="0" stop-color="#ff7169" />
			<stop offset="1" stop-color="#d4001b" />
		</linearGradient>
		<radialGradient id="sign-out-glow" cx="0.3" cy="0.05" r="0.8">
			<stop offset="0" stop-color="#fff" stop-opacity="0.3" />
