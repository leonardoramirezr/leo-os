<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
	<defs>
		<linearGradient id="sign-out-bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#303036" />
			<stop offset="1" stop-color="#0e0e11" />
		</linearGradient>
		<linearGradient id="sign-out-red" x1="0" y1="200" x2="0" y2="820" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#ff7a70" />
			<stop offset="1" stop-color="#e3001c" />
		</linearGradient>
		<filter id="sign-out-blur" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
			<feGaussianBlur stdDeviation="30" />
		</filter>
		<!-- The power button -->
		<g id="sign-out-power" fill="none" stroke="url(#sign-out-red)" stroke-width="86" stroke-linecap="round">
			<path d="M645.1 350.7A238 238 0 1 1 378.9 350.7" />
			<path d="M512 236v268" />
		</g>
	</defs>
	<rect width="1024" height="1024" fill="url(#sign-out-bg)" />
	<!-- The glow is a blurred copy of its own under the button: Safari draws whatever goes through
	     a filter blurry on 3x screens, and a glow can afford to be. -->
	<use href="#sign-out-power" filter="url(#sign-out-blur)" opacity="0.6" />
	<use href="#sign-out-power" />
</svg>
