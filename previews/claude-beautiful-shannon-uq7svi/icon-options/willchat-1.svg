<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
	<defs>
		<linearGradient id="willchat-bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#6b5cff" />
			<stop offset="0.5" stop-color="#a855f0" />
			<stop offset="1" stop-color="#f0519c" />
		</linearGradient>
		<radialGradient id="willchat-glow" cx="0.28" cy="0.12" r="0.8">
			<stop offset="0" stop-color="#fff" stop-opacity="0.3" />
			<stop offset="1" stop-color="#fff" stop-opacity="0" />
		</radialGradient>
		<linearGradient id="willchat-white" x1="0" y1="240" x2="0" y2="800" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#fff" />
			<stop offset="1" stop-color="#f6eefe" />
		</linearGradient>
		<filter id="willchat-shadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
			<feGaussianBlur in="SourceAlpha" stdDeviation="20" />
			<feOffset dy="16" result="offset" />
			<feFlood flood-color="#4a1a8c" flood-opacity="0.35" />
			<feComposite in2="offset" operator="in" />
		</filter>
		<g id="willchat-glyph">
			<path
				d="M232 348 392 716 512 460 632 716 792 348"
				fill="none"
				stroke="url(#willchat-white)"
				stroke-width="100"
				stroke-linecap="round"
				stroke-linejoin="round"
			/>
			<!-- A spark: the images it makes -->
			<path d="M800 150c8 50 26 68 76 76-50 8-68 26-76 76-8-50-26-68-76-76 50-8 68-26 76-76z" fill="url(#willchat-white)" />
		</g>
	</defs>
	<rect width="1024" height="1024" fill="url(#willchat-bg)" />
	<rect width="1024" height="1024" fill="url(#willchat-glow)" />
	<!-- The shadow is a copy of its own under the glyph: Safari draws whatever goes through a filter
	     blurry on 3x screens, and a shadow can afford to be. -->
	<use href="#willchat-glyph" filter="url(#willchat-shadow)" />
	<use href="#willchat-glyph" />
</svg>
