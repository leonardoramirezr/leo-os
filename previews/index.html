<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Previews · Leo OS</title>
		<style>
			:root {
				color-scheme: light dark;
				--bg: #f2f2f7;
				--text: #0d0d0d;
				--muted: #6b6b76;
				--group: #ffffff;
				--border: #e3e3e6;
				--link: #0a84ff;
			}

			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #1c1c1e;
					--text: #ececec;
					--muted: #a3a3ab;
					--group: #2c2c2e;
					--border: #3a3a3d;
				}
			}

			body {
				max-width: 560px;
				margin: 0 auto;
				padding: 32px 16px 48px;
				background: var(--bg);
				color: var(--text);
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
				-webkit-font-smoothing: antialiased;
			}

			h1 {
				margin: 0 4px 4px;
				font-size: 24px;
			}

			p {
				margin: 0 4px 24px;
				color: var(--muted);
				font-size: 15px;
			}

			ul {
				margin: 0;
				padding: 0;
				overflow: hidden;
				border-radius: 12px;
				background: var(--group);
				list-style: none;
			}

			li + li {
				border-top: 1px solid var(--border);
			}

			/* Stacked: a branch name is long and must not be cut off. */
			a {
				display: flex;
				flex-direction: column;
				gap: 3px;
				padding: 14px 16px;
				color: var(--link);
				text-decoration: none;
			}

			.branch {
				overflow-wrap: anywhere;
			}

			.meta {
				color: var(--muted);
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				font-size: 12px;
			}
		</style>
	</head>
	<body>
		<h1>Previews</h1>
		<p>One per branch with unpublished changes. Deleting the branch removes it.</p>
		<ul>
			<li>
				<a href="./claude-happy-albattani-q7cqsy/">
					<span class="branch">claude/happy-albattani-q7cqsy</span>
					<span class="meta">932f3fe · 2026-09-24 05:00 UTC</span>
				</a>
			</li>
			<li>
				<a href="./claude-hopeful-mayer-bc6euw/">
					<span class="branch">claude/hopeful-mayer-bc6euw</span>
					<span class="meta">efa0594 · 2026-09-23 06:14 UTC</span>
				</a>
			</li>
			<li>
				<a href="./claude-admiring-wozniak-ux07hr/">
					<span class="branch">claude/admiring-wozniak-ux07hr</span>
					<span class="meta">87d6cd1 · 2026-09-21 21:20 UTC</span>
				</a>
			</li>
		</ul>
	</body>
</html>
