<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
	<!-- Leo OS's icon (home/src/lib/icon.svg) drawn as a draft: the tiles left as dashed outlines. -->
	<defs>
		<linearGradient id="icon-bg" x1="0" y1="0" x2="0.4" y2="1">
			<stop offset="0" stop-color="#3b2a7a" />
			<stop offset="1" stop-color="#1c1446" />
		</linearGradient>
		<linearGradient id="icon-accent" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ffa95a" />
			<stop offset="1" stop-color="#e94fa1" />
		</linearGradient>
	</defs>
	<rect width="1024" height="1024" rx="230" fill="url(#icon-bg)" />
	<!-- Inset by half the stroke, so each outline covers the same square as the tile it stands for. -->
	<g fill="none" stroke="#fff" stroke-width="22" stroke-dasharray="44 30" stroke-linecap="round">
		<rect x="235" y="235" width="138" height="138" rx="36" />
		<rect x="443" y="235" width="138" height="138" rx="36" opacity="0.94" />
		<rect x="651" y="235" width="138" height="138" rx="36" opacity="0.88" />
		<rect x="235" y="443" width="138" height="138" rx="36" opacity="0.94" />
		<rect x="651" y="443" width="138" height="138" rx="36" opacity="0.82" />
		<rect x="235" y="651" width="138" height="138" rx="36" opacity="0.88" />
		<rect x="443" y="651" width="138" height="138" rx="36" opacity="0.82" />
		<rect x="651" y="651" width="138" height="138" rx="36" opacity="0.76" />
	</g>
	<rect x="432" y="432" width="160" height="160" rx="44" fill="url(#icon-accent)" />
</svg>
